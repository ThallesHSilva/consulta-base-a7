<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar conta - A7 Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="auth-body login-page register-page">
    <main class="auth-shell login-shell">
      <section class="auth-brand-panel login-showcase" aria-label="Cadastro na plataforma">
        <div class="login-showcase-copy">
          <h1>Seu próximo passo começa aqui.</h1>
          <p>Crie seu acesso com segurança e entre em um ambiente preparado para transformar dados em decisões.</p>
        </div>
      </section>

      <section class="auth-card login-card" aria-label="Cadastro">
        <div class="auth-tabs">
          <a class="auth-tab" href="/login">Entrar</a>
          <a class="auth-tab active" href="/cadastro">Criar conta</a>
        </div>
        <div class="auth-heading">
          <h2>Criar conta</h2>
          <p>Informe seus dados. Enviaremos um link para confirmar seu e-mail.</p>
        </div>
        <form id="registerForm" class="auth-form">
          <label>
            <span>Empresa</span>
            <select id="registerOrganization" name="organization_slug" autocomplete="organization" required>
              <option value="">Carregando empresas...</option>
            </select>
            <small class="field-hint">Selecione a empresa que autorizou seu acesso.</small>
          </label>
          <label>
            <span>Nome completo</span>
            <input id="registerName" name="nome_completo" type="text" autocomplete="name" required />
          </label>
          <label>
            <span>E-mail</span>
            <input id="registerEmail" name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            <span>Senha</span>
            <input id="registerPassword" name="senha" type="password" autocomplete="new-password" required />
          </label>
          <label>
            <span>Confirmar senha</span>
            <input id="registerPasswordConfirm" name="senha_confirmacao" type="password" autocomplete="new-password" required />
          </label>
          <button class="gradient-button auth-submit" type="submit">Enviar cadastro</button>
          <p id="authMessage" class="auth-message" aria-live="polite" hidden></p>
        </form>
      </section>
    </main>

    <script src="/static/auth.js"></script>
  </body>
</html>
